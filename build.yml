name: Build plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # If .zip files are in the repo, build the one that was uploaded most recently.
      # Otherwise build the project files that are in the repo itself.
      - name: Prepare project
        run: |
          shopt -s nullglob
          ZIP=""
          BEST=0
          for f in *.zip; do
            T=$(git log -1 --format=%ct -- "$f")
            if [ "${T:-0}" -ge "$BEST" ]; then BEST="${T:-0}"; ZIP="$f"; fi
          done
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            mkdir -p build
            unzip -o "$ZIP" -d build
            echo "PROJECT_DIR=$(dirname "$(find build -name pom.xml | head -n1)")" >> "$GITHUB_ENV"
          else
            echo "No zip found, building the files in the repo"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Build with Maven
        run: cd "$PROJECT_DIR" && mvn -B package

      - name: Publish the jar as a new release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          make_latest: true
          files: ${{ env.PROJECT_DIR }}/target/*.jar
