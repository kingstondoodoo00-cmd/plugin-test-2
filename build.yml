name: Build plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # If a .zip of the project is in the repo, unpack it and build that.
      # Otherwise build the project files that are in the repo itself.
      - name: Prepare project
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            mkdir -p build
            unzip -o "$ZIP" -d build
            echo "PROJECT_DIR=$(dirname "$(find build -name pom.xml | head -n1)")" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Build with Maven
        run: cd "$PROJECT_DIR" && mvn -B package

      - name: Publish the jar as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: ${{ env.PROJECT_DIR }}/target/*.jar
