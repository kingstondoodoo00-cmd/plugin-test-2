name: CommandBlockSpawner
version: 1.6.3
main: com.example.cbspawner.CommandBlockSpawner
api-version: "1.21"
commands:
  commandblockmacestart:
    description: Places the command block at 500 150 500 so the Command Block Mace can be made
    usage: /commandblockmacestart
    aliases: [spawncommandblock]
    permission: cbspawner.use
permissions:
  cbspawner.use:
    description: Allows use of /commandblockmacestart
    default: op
